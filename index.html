    <script>
      (function () {
        try {
          var saved = localStorage.getItem('boby_studio_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
